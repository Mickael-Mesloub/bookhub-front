@if (notifMsg(); as notif) {
  @if (notif.type === 'loading') {
    <div class="loading-overlay">
      <div class="loading-modal">
        <div class="loading-text">
          <p>{{ notif.message }}</p>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
  } @else {
    <div class="alert fixed left-[40%] top-[7.5%]" [class]="notif.type">
      {{ notif.message }}
    </div>
  }
}
