<div class="flex flex-col gap-2">
  @if (label()) {
    <label for="title" class="font-bold"
      >{{ label() }}
      @if (required()) {
        <span class="text-red-400">&#42;</span>
      }
    </label>
  }

  <input
    type="text"
    class="block w-full rounded-xl border border-gray-700 bg-gray-700 px-3 py-2.5 text-sm text-gray-50 shadow-xs placeholder:text-gray-400 focus:border-gray-50 focus:ring-gray-50"
    placeholder="{{ placeholder() }}"
  />
</div>
