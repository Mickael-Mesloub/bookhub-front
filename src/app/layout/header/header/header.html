<header class="w-full">
  <nav class="fixed inset-x-0 top-0 z-20 w-full bg-gray-700">
    <div class="mx-auto flex max-w-7xl items-center justify-between p-4">
      <!-- Logo -->
      <a routerLink="/" class="text-lg font-semibold text-white">BookHub</a>

      <!-- Menu desktop -->
      <ul class="hidden md:flex md:items-center md:gap-1">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-white/10 text-white"
              class="block rounded-md px-3 py-2 text-sm text-gray-300 transition hover:bg-white/10 hover:text-white"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!-- Burger button -->
      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
        class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full text-gray-300 transition hover:bg-white/10 hover:text-white focus:ring-2 focus:ring-white focus:outline-none md:hidden"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            class="origin-center transition-all duration-300"
            [attr.d]="isMenuOpen() ? 'M5 5 L19 19' : 'M5 7 L19 7'"
          />
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            [class.opacity-0]="isMenuOpen()"
            class="transition-opacity duration-200"
            d="M5 12 L19 12"
          />
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            class="origin-center transition-all duration-300"
            [attr.d]="isMenuOpen() ? 'M5 19 L19 5' : 'M5 17 L19 17'"
          />
        </svg>
      </button>
    </div>

    <!-- Menu mobile -->
    <div
      id="mobile-menu"
      class="overflow-hidden transition-all duration-300 ease-in-out md:hidden"
      [class.max-h-0]="!isMenuOpen()"
      [class.max-h-64]="isMenuOpen()"
      [class.opacity-0]="!isMenuOpen()"
      [class.opacity-100]="isMenuOpen()"
    >
      <ul class="flex flex-col gap-1 border-t border-white/10 bg-gray-800 px-4 py-3">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-white/10 text-white"
              (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-sm text-gray-300 transition hover:bg-white/10 hover:text-white"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
