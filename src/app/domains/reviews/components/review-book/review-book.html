@defer (on timer(1000)) {
@if(bookReviews.length > 0){
  <ul class="w-full">
    @for (review of bookReviews; track review.id) {      
      <li>User: {{ review.userId }} :</li>
      <li>Review: {{ review.comment }}</li>
      <li>Score: {{ review.score }}</li>
    }
  </ul>
}
@else {
    <div>Il n'y a pas encore de reviews pour ce livre</div>
}
}
 @placeholder {
  <p class="text-gray-50">LOADING...</p>
}
