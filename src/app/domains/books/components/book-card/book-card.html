



<div [routerLink]="['/detail/', book().isbn]" class="bg-neutral-primary-soft block max-w-sm border border-default rounded-base shadow-xs">
    <p>{{ book().title }}</p>
    <a  >
        <img class="rounded-t-base" [src]= book().coverUrl alt="book cover" />
    </a>
    <div class="p-6 text-center">
            <h5 class="mt-3 mb-6 text-2xl font-semibold tracking-tight text-heading">{{ book().author }} - {{ book().title }}</h5>
    </div>
</div>
