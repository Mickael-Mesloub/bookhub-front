<div
  (click)="navigateToDetails(book().isbn)"
  class="bg-neutral-primary-soft border-default rounded-base block max-w-sm border shadow-xs"
>
  <p>{{ book().title }}</p>
  <img class="rounded-t-base" [src]="book().coverUrl" alt="book cover" />
  <div class="p-6 text-center">
    <h5 class="text-heading mt-3 mb-6 text-2xl font-semibold tracking-tight">
      {{ book().author }} - {{ book().title }}
    </h5>
  </div>
</div>
