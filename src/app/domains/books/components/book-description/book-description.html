<div >
  <div class="grid grid-cols-1 p-8 gap-8 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-2">
    <div class="max-h-100 max-w-60">
      @if(book().coverUrl){
      <img class="h-full w-full rounded-t-base" [src]="book().coverUrl" alt="book cover" />
      }
      @else{
      <img class="h-full w-full rounded-t-base" src="images/empty-cover-img.png" alt="no cover available" />
      }
    </div>
    <div class="p-6 text-center">
      <p class="text-heading mt-3 mb-6 text-left text-2xl font-semibold tracking-tight">
        Category: {{ book().category.category }}
      </p>
      <p class="text-heading mt-3 mb-6 text-left text-2xl font-semibold tracking-tight">
        Auteur: {{ book().author }}
      </p>
      <p class="text-heading mt-3 mb-6 text-left text-2xl font-semibold tracking-tight">
        Titre: {{ book().title }}
      </p>
      <p class="text-heading mt-3 mb-6 text-left text-2xl font-semibold tracking-tight">
        Description: {{ book().description }}
      </p>
      <p class="text-heading mt-3 mb-6 text-left text-2xl font-semibold tracking-tight">
        ISBN: {{ book().isbn }}
      </p>
    </div>
  </div>
</div>
