<section class="flex w-full flex-col items-center justify-center">
  <article class="w-full rounded-2xl bg-gray-800/80 p-6 md:max-w-120">
    <h2>Créer un livre</h2>

    <form>
      <div class="input-wrapper">
        <label for="title">Titre</label>
        <input
          class="block w-full rounded-xl border border-gray-700 bg-gray-700 px-3 py-2.5 text-sm text-gray-50 shadow-xs placeholder:text-gray-400 focus:border-gray-50 focus:ring-gray-50"
          type="text"
          id="title"
          name="title"
          placeholder="Titre du livre"
        />
      </div>
      <div class="input-wrapper">
        <label for="author">Auteur</label>
        <input
          class="block w-full rounded-xl border border-gray-700 bg-gray-700 px-3 py-2.5 text-sm text-gray-50 shadow-xs placeholder:text-gray-400 focus:border-gray-50 focus:ring-gray-50"
          type="text"
          id="author"
          name="author"
          placeholder="Auteur du livre"
        />
      </div>
    </form>
  </article>
</section>
