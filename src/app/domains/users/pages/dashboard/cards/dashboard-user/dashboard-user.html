@if (isAuthenticated()) {
  <div class="bg-neutral-primary-soft border-default rounded-base block max-w-sm border shadow-xs">
    <h2>Profil</h2>
    <p>Username : {{ currentUser()?.username }}</p>
    <p>Email : {{ currentUser()?.email }}</p>
    <p>Nom : {{ currentUser()?.lastname }}</p>
    <p>Prénom : {{ currentUser()?.firstname }}</p>
    <p>Role : {{ currentUser()?.role }}</p>
    <app-button label="Modifier mon profil" (clickAction)="goToEditProfile()"></app-button>
  </div>
} @else {
  <p>Chargement...</p>
}
<div><app-reservations /></div>
